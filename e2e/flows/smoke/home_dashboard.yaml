# M3-04: Home shows the dashboard cards; "New block" opens the wizard.
# Usage access is off on a fresh emulator, so the gauge card shows its "Allow usage access" state.
appId: com.dculus.stayfocused
tags:
  - smoke
---
- launchApp:
    clearState: true
- tapOn: "Get started"
- tapOn: "Continue without an account"
- tapOn: "Continue"
- assertVisible: "SCREEN TIME"
- assertVisible: "Allow usage access"
- assertVisible: "Take a break"
- tapOn: "New block"
- assertVisible: "Rather just describe it?"

# M1-09 / M3-04: the app opens on onboarding (flag stub = false); Get started, Continue without an account, Start using Vesper reaches Home, then the tabs work.
appId: com.dculus.vesper
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: "Get started"
- tapOn: "Get started"
- assertVisible: "Continue with Google"
- tapOn: "Continue without an account"
- assertVisible: "Allow"
- tapOn: "Start using Vesper"
- assertVisible: "Take a break"
- tapOn: "Blocks"
- assertVisible: "New block"
- tapOn: "Family"
- tapOn: "Insights"
- back
- assertVisible: "Take a break"
- tapOn: "Account"
- assertVisible: "Account"
# The tab bar stays visible on Account.
- assertVisible: "Blocks"

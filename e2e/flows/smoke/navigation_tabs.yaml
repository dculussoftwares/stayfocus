# M1-09 / M3-04: the app opens on onboarding (flag stub = false); Get started, Continue without an account, Continue reaches Home, then the tabs work.
appId: com.dculus.stayfocused
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: "Get started"
- tapOn: "Get started"
- assertVisible: "Sign in"
- tapOn: "Continue without an account"
- assertVisible: "Permissions"
- tapOn: "Continue"
- assertVisible: "Take a break"
- tapOn: "BLOCK"
- assertVisible: "New block"
- tapOn: "DEVICES"
- tapOn: "INSIGHTS"
- back
- assertVisible: "Take a break"
- tapOn: "Account"
- assertVisible: "Account"
# The tab bar stays visible on Account.
- assertVisible: "BLOCK"

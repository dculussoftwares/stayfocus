# M12-19: Insights opens on Day, switches to Week and back; both hero labels show.
appId: com.dculus.stayfocused
tags:
  - journey
---
- launchApp:
    clearState: true
- tapOn: "Get started"
- tapOn: "Continue without an account"
- tapOn: "Continue for now"
- tapOn: "Insights"
- assertVisible: "Screen time today"
- assertVisible: "Unlocks"
- assertVisible: "Blocked"
- tapOn: "Week"
- assertVisible: "Daily average this week"
- tapOn: "Day"
- assertVisible: "Screen time today"

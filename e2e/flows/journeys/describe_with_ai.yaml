# M12-19: "Describe a block" in the CI build (no Firebase config), so the on-device parser is the path under test.
# The sentence becomes a draft in the wizard; nothing turns on until "Turn on block".
appId: com.dculus.stayfocused
tags:
  - journey
---
- launchApp:
    clearState: true
- tapOn: "Get started"
- tapOn: "Continue without an account"
- tapOn: "Continue for now"
- scrollUntilVisible:
    element: "Describe a block in your words"
- tapOn: "Describe a block in your words"
- assertVisible: "Describe a block"
- assertVisible: "AI sets it up. Nothing turns on until you check it."
- tapOn: "e.g. Let me use Instagram.*"
- inputText: "Instagram 10 min, then lock it for 30"
- hideKeyboard
- tapOn: "Build my block"
- assertVisible: "Set the rule"
- assertVisible: "Check the details, then turn it on."
- assertVisible: "Turn on block"

# Overrides on top of detekt's defaults (buildUponDefaultConfig = true). Compose-friendly.
style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreExtensionFunctions: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*Test.kt', '**/*Preview*.kt']
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateProperty:
    ignoreAnnotated: ['Preview']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    # Composables take many parameters (state, callbacks, Modifier); raised from detekt's default of 6.
    allowedFunctionParameters: 10
    allowedConstructorParameters: 7
    ignoreDefaultParameters: true
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']

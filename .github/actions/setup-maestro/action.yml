name: Set up Maestro
description: Installs the pinned Maestro CLI (checksum-verified) and puts it on PATH.

inputs:
  version:
    description: Maestro CLI release (tag cli-<version>)
    default: "2.11.0"
  sha256:
    description: SHA-256 of maestro.zip for that release
    default: "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MAESTRO_VERSION: ${{ inputs.version }}
        MAESTRO_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
          "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
        echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum --check
        unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

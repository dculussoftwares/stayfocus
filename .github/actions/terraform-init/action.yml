name: terraform-init
description: >
  Load infra/prod.env, log in to GCP without keys (Workload Identity Federation) and run terraform init for one
  module with its state in the GCS bucket. The calling job needs `permissions: id-token: write`.

inputs:
  module:
    description: "Terraform root under infra/: seed, gcp, github or cloudflare."
    required: true
  identity:
    description: "plan (read-only, any job of this repo) or deploy (only jobs in the GitHub environment prod)."
    required: true

runs:
  using: composite
  steps:
    # prod.env is a committed file of public KEY=value lines (no PR-controlled input reaches it on main).
    - name: Load infra/prod.env
      shell: bash
      run: grep -E '^[A-Z_]+=' infra/prod.env >> "$GITHUB_ENV" # zizmor: ignore[github-env]

    # The gcp module zips firebase/functions/dist/<name> for each function.
    - if: inputs.module == 'gcp'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: firebase/functions/package-lock.json
    - if: inputs.module == 'gcp'
      name: Build the functions
      shell: bash
      working-directory: firebase/functions
      run: |
        npm ci --ignore-scripts
        npm run build

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_wrapper: false

    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
        service_account: ${{ inputs.identity == 'deploy' && env.GCP_DEPLOY_SA || env.GCP_PLAN_SA }}

    - name: terraform init
      shell: bash
      working-directory: infra/${{ inputs.module }}
      env:
        IDENTITY: ${{ inputs.identity }}
        MODULE: ${{ inputs.module }}
      run: |
        # A new module has no state yet, and the read-only identity can't create it: plan against an empty local
        # state until the first apply writes it.
        if [ "$IDENTITY" = plan ] && ! gcloud storage ls "gs://${TF_STATE_BUCKET}/${MODULE}/default.tfstate" >/dev/null 2>&1; then
          echo "::notice::No state for ${MODULE} yet; planning against an empty state."
          printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
          terraform init -input=false
        else
          terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"
        fi

name: codeql

# CodeQL code scanning (M1-15): Kotlin/Java, JavaScript/TypeScript (Cloud Functions) and the workflows themselves.
# Results land in the Security tab; they are reviewed there and are not a merge gate.
# Third-party actions are pinned to commit SHAs.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
            sources: ":(glob)**/*.kt :(glob)**/*.java"
          - language: javascript-typescript
            build-mode: none
            sources: ":(glob)firebase/functions/**/*.ts :(glob)firebase/functions/**/*.js"
          - language: actions
            build-mode: none
            sources: ":(glob).github/workflows/*.yml"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL fails when it finds no source for a language (e.g. before the Cloud Functions exist), so skip those.
      - name: Check for sources
        id: sources
        env:
          PATTERNS: ${{ matrix.sources }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          # shellcheck disable=SC2086
          if [ -n "$(git ls-files -- $PATTERNS | head -n 1)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No $LANGUAGE sources yet; skipping."
          fi
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: steps.sources.outputs.found == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.sources.outputs.found == 'true' && matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.sources.outputs.found == 'true' && matrix.language == 'java-kotlin'
        with:
          cache-read-only: true
      - name: Build (manual build mode)
        if: steps.sources.outputs.found == 'true' && matrix.language == 'java-kotlin'
        run: ./gradlew :app:assembleDebug :kids:assembleDebug --no-build-cache
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: steps.sources.outputs.found == 'true'
        with:
          category: "/language:${{ matrix.language }}"

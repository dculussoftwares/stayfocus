name: infra

# All infrastructure, as Terraform, in one pipeline (docs/INFRASTRUCTURE.md):
#   infra/seed    project, state bucket, keyless GitHub login, CI identities
#   infra/gcp     Firebase, Auth, Firestore + rules, App Check, Functions, AI Logic, monitoring, budgets
#   infra/github  repo settings, ruleset, `prod` environment, backlog labels/milestones/issues
#
# PR:    validate every module; plan every module with the read-only identity; one comment per module.
# Merge: apply seed, then github and gcp, in the GitHub environment `prod` (the only place the deploy identity works).
# GCP login is keyless (Workload Identity Federation); the values it needs are in infra/prod.env.
# Third-party actions are pinned to commit SHAs.

on:
  pull_request:
    paths:
      - "infra/**"
      - "backlog/**"
      - "firebase/firestore.rules"
      - "firebase/functions/**"
      - "scripts/infra/**"
      - "scripts/backlog/**"
      - ".github/actions/terraform-init/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "backlog/**"
      - "firebase/firestore.rules"
      - "firebase/functions/**"
      - "scripts/infra/**"
      - "scripts/backlog/**"
      - ".github/actions/terraform-init/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

concurrency:
  group: infra-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    # No credentials: runs for every PR, forks included.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [seed, gcp, github]
    defaults:
      run:
        working-directory: infra/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    # Fork PRs get no OIDC token and no secrets, so they stop at validate.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: seed
            plan_args: ""
          - module: gcp
            plan_args: ""
          # The read-only GITHUB_TOKEN can't read settings that need Administration; the plan compares config with
          # the last applied state instead.
          - module: github
            plan_args: "-refresh=false"
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
      TF_VAR_google_oauth_client_id: ${{ vars.GOOGLE_OAUTH_WEB_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_SECRET }}
      TF_VAR_app_check_debug_tokens: ${{ secrets.APP_CHECK_DEBUG_TOKENS || '{}' }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-init
        with:
          module: ${{ matrix.module }}
          identity: plan
      - id: plan
        working-directory: infra/${{ matrix.module }}
        env:
          PLAN_ARGS: ${{ matrix.plan_args }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # PLAN_ARGS is a list of flags
          terraform plan -no-color -lock=false $PLAN_ARGS | tee plan.txt
      - name: Comment the plan on the PR
        if: always() && steps.plan.outcome != 'skipped'
        working-directory: infra/${{ matrix.module }}
        env:
          MODULE: ${{ matrix.module }}
        run: ../../scripts/infra/plan-comment.sh "$MODULE" plan.txt

  apply-seed:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-init
        with:
          module: seed
          identity: deploy
      - working-directory: infra/seed
        run: terraform apply -auto-approve

  apply-gcp:
    needs: apply-seed
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
      TF_VAR_google_oauth_client_id: ${{ vars.GOOGLE_OAUTH_WEB_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_SECRET }}
      TF_VAR_app_check_debug_tokens: ${{ secrets.APP_CHECK_DEBUG_TOKENS || '{}' }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-init
        with:
          module: gcp
          identity: deploy
      - working-directory: infra/gcp
        run: terraform apply -auto-approve

  apply-github:
    needs: apply-seed
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-init
        with:
          module: github
          identity: deploy
      # One-time move of this module's state from HCP Terraform to GCS. Does nothing once the GCS state has resources
      # or when the TF_API_TOKEN secret is gone. Remove this step after the move.
      - name: Move the state from HCP Terraform (one time)
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          [ -n "$TF_API_TOKEN" ] || exit 0
          obj="gs://${TF_STATE_BUCKET}/github/default.tfstate"
          n=$(gcloud storage cat "$obj" 2>/dev/null | jq '.resources | length' 2>/dev/null || true)
          if [ "${n:-0}" != "0" ]; then echo "GCS state already has $n resources"; exit 0; fi
          auth=(-H "Authorization: Bearer ${TF_API_TOKEN}")
          ws=$(curl -sSf "${auth[@]}" https://app.terraform.io/api/v2/organizations/dculus/workspaces/stayfocus-github | jq -r .data.id)
          url=$(curl -sSf "${auth[@]}" "https://app.terraform.io/api/v2/workspaces/${ws}/current-state-version" | jq -r '.data.attributes."hosted-state-download-url"')
          curl -sSfL "${auth[@]}" "$url" -o "$RUNNER_TEMP/hcp.tfstate"
          jq -e '.resources | length > 0' "$RUNNER_TEMP/hcp.tfstate" > /dev/null
          gcloud storage cp "$RUNNER_TEMP/hcp.tfstate" "$obj"
          rm -f "$RUNNER_TEMP/hcp.tfstate"
          echo "Moved $(gcloud storage cat "$obj" | jq '.resources | length') resources to $obj"
      # Repo settings and the ruleset need Repository -> Administration; the board needs org Projects.
      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BACKLOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.BACKLOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - working-directory: infra/github
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: terraform apply -auto-approve
      - name: Link sub-issues and dependencies, sync the project board
        working-directory: infra/github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          terraform output -json backlog > "$RUNNER_TEMP/backlog.json"
          python3 ../../scripts/backlog/sync_project.py "$RUNNER_TEMP/backlog.json" relations
          GH_TOKEN="$APP_TOKEN" python3 ../../scripts/backlog/sync_project.py "$RUNNER_TEMP/backlog.json" board

name: dependency-graph-submit

# Second half of the Gradle dependency graph for pull requests (M1-15). dependency-graph.yml builds the
# graph from the PR sources with a read-only token and uploads it as an artifact; this workflow, which runs from the default
# branch and checks out no PR code, submits it so dependency review can see Gradle changes (forks included).
# https://github.com/gradle/actions/blob/v6.4.0/docs/dependency-submission.md

on:
  workflow_run:
    workflows: [dependency-graph]
    types: [completed]

permissions: {}

jobs:
  submit:
    name: submit
    # Only PR runs upload a graph; main submits its own (dependency-graph.yml, push to main).
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write # Dependency Submission API
    steps:
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit

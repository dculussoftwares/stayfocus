name: infra-bootstrap

# One-time GCP foundation (infra/bootstrap): projects, billing link, Workload Identity Federation, deploy
# service account. Manual only. Uses the TEMPORARY secret GCP_BOOTSTRAP_CREDENTIALS (a service-account key JSON of a
# bootstrap identity). Delete that secret and the key right after the first successful run
# (docs/INFRASTRUCTURE.md, Firebase/GCP); a workflow cannot delete a repository secret. Later role changes in
# infra/bootstrap need a fresh temporary key the same way. Secret GCP_BILLING_ACCOUNT holds the billing account ID.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply (otherwise plan only)"
        type: boolean
        default: false

concurrency:
  group: infra-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: ${{ vars.TF_WORKSPACE_BOOTSTRAP || 'stayfocus-bootstrap' }}
  TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
  TF_VAR_org_id: ${{ vars.GCP_ORG_ID }}
  # Immutable id of the repository running this workflow (forks use their own).
  TF_VAR_github_repository_id: ${{ github.repository_id }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: infra/bootstrap

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false
      - name: Project id override (forks)
        if: vars.GCP_PROJECT_ID_DEV != ''
        run: echo 'TF_VAR_environments={ dev = { project_id = "${{ vars.GCP_PROJECT_ID_DEV }}" } }' >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_BOOTSTRAP_CREDENTIALS }}
      - name: Ensure HCP Terraform workspace
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: ../../scripts/infra/ensure_tfc_workspace.sh
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -no-color -out=tfplan
      - if: inputs.apply
        run: terraform apply -input=false -auto-approve tfplan
      - name: Print values for the GitHub variables
        if: inputs.apply
        run: terraform output -json projects

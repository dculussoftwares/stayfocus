name: pages

# The website moved to https://vesper.dculus.com (web/, deployed to Cloudflare by web.yml). GitHub Pages now serves
# only redirects (web/github-pages/) from the old dculussoftwares.github.io/vesper URLs, which older app versions and
# store listings still link to. Pages itself is enabled by Terraform (infra/github, `github_repository_pages`).
# Third-party actions are pinned to commit SHAs.

on:
  push:
    branches: [main]
    paths:
      - "web/github-pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

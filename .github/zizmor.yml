# zizmor configuration (security.yml, job workflow-audit). Every exception needs a reason.
rules:
  dangerous-triggers:
    ignore:
      # workflow_run is the documented way to submit a fork PR's Gradle dependency graph with a write token. The workflow
      # checks out nothing, runs no PR-controlled code and only passes the uploaded graph to the Dependency Submission API.
      - dependency-graph-submit.yml
